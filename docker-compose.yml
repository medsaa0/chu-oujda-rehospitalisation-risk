services:
  postgres:
    image: postgres:16-alpine
    container_name: chu_readmission_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readmission_dw}
      POSTGRES_USER: ${POSTGRES_USER:-readmission_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readmission_password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

